<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14100E" />

    <title>VYBE — Streetwear made for your vibe</title>
    <meta
      name="description"
      content="VYBE is streetwear for people who own their vibe and live it loud. Limited drops, bold graphics, and a tribe that wears them first."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VYBE" />
    <meta property="og:title" content="VYBE — Streetwear made for your vibe" />
    <meta
      property="og:description"
      content="Limited drops, bold graphics, and a tribe that wears them first. Own the edge, keep the vibe."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="apple-touch-icon" href="/mark.svg" />

    <!--
      Type: Big Shoulders Display (poster display) + Archivo (body)
            + Courier Prime (utility / prices / labels).
      Loaded via <link> rather than a CSS @import so it doesn't sit behind a
      render-blocking request chain.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
